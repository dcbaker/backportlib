[build-system]
  requires = ["flit_core >=3.2,<4"]
  build-backend = "flit_core.buildapi"

[project]
  name = "backportlib"
  authors = [
    {name = "Dylan Baker", email = "dylan@pnwbakers.com"}
  ]
  dynamic = ["version", "description"]
  classifiers = [
    "License :: OSI Approved :: MIT License"
  ]
  readme = "README.md"
  requires-python = ">=3.14"
  dependencies = [
    "simple_py_monads >= 0.0.6",
    "pydantic >=2,<3",
  ]

  [project.urls]
    Home = "https://github.com/dcbaker/backportlib"

[tool.flit.module]
  name = "backportlib"

[tool.mypy]
  packages = ['backportlib', 'tests']
  plugins = ["pydantic.mypy"]
  strict = true
  warn_unreachable = true

[tool.ruff]
  line-length = 100
  target-version = "py311"

  [tool.ruff.lint]
    select = ["E", "F", "I", "UP"]
