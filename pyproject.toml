[build-system]
  requires = ["flit_core >=3.2,<4"]
  build-backend = "flit_core.buildapi"

[project]
  name = "backportlib"
  authors = [
    {name = "Dylan Baker", email = "dylan@pnwbakers.com"}
  ]
  dynamic = ["version", "description"]
  classifiers = [
    "License :: OSI Approved :: MIT License"
  ]
  readme = "README.md"
  requires-python = ">=3.14"

  [project.urls]
    Home = "https://github.com/dcbaker/backportlib"

[tool.flit.module]
  name = "backportlib"

[tool.mypy]
  packages = ['backportlib', 'tests']
  strict = true
